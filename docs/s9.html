    .rubric-title { position: absolute; bottom: 20px; left: 30px; z-index: 10; font-size: 2.5rem; font-weight: 800; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

    .dark .goog-te-gadget .goog-te-combo { background: #1e293b; border: 1px solid #475569; color: white; }

    /* Rich Text Area */
    .rich-editor[contenteditable="true"]:empty:before { content: attr(placeholder); color: #94a3b8; pointer-events: none; display: block; }

</head>
<body class="antialiased h-screen flex flex-col overflow-hidden bg-slate-50 dark:bg-[#0b1120] text-slate-900 dark:text-slate-200 transition-colors duration-300">

  <!-- TOP-RIGHT FUTURISTIC PARAMETER WIDGET -->
  <div class="fixed top-4 right-4 z-[100]">
    <button id="paramBtn" class="glass p-3 rounded-full hover:scale-110 transition-transform shadow-lg text-slate-700 dark:text-cyan-400 border border-slate-300 dark:border-cyan-500/30">
      <svg class="w-6 h-6 animate-[spin_6s_linear_infinite]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    </button>
    <div id="paramMenu" class="hidden absolute top-14 right-0 glass rounded-2xl shadow-2xl p-5 w-72 border border-slate-200 dark:border-slate-700 transition-all">
      <div class="mb-5">
        <label class="text-[10px] font-bold uppercase tracking-widest text-cyan-600 dark:text-cyan-400 mb-2 block">Traduction Globale</label>
        <div id="google_translate_element" class="min-h-[30px]"></div>
      </div>
      <div class="mb-5 border-t border-slate-200 dark:border-slate-700 pt-5">
        <label class="text-[10px] font-bold uppercase tracking-widest text-cyan-600 dark:text-cyan-400 mb-2 block">Interface Visuelle</label>
        <button onclick="toggleTheme()" class="w-full flex items-center justify-between text-sm font-bold bg-slate-100 dark:bg-slate-800 p-3 rounded-xl border border-transparent hover:border-cyan-500 transition-colors">
          <span id="themeText">Mode Sombre</span>
          <svg id="themeIcon" class="w-5 h-5 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
      </div>
      <button onclick="logout()" class="w-full flex items-center justify-center gap-2 bg-rose-500/10 text-rose-600 dark:text-rose-400 hover:bg-rose-500 hover:text-white transition-all font-bold p-3 rounded-xl text-sm border-t border-slate-200 dark:border-slate-700 mt-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Déconnexion Sécurisée
      </button>
    </div>
  </div>

  <!-- AUTH PORTAL -->
  <div id="authPortal" class="fixed inset-0 z-50 flex items-center justify-center bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop')] bg-cover bg-center">
    <div class="absolute inset-0 bg-white/60 dark:bg-slate-900/80 backdrop-blur-lg"></div>
    <div class="relative w-full max-w-md glass rounded-[2rem] p-10 shadow-2xl text-center mx-4">
      <div class="w-24 h-24 mx-auto bg-gradient-to-tr from-cyan-400 to-blue-600 rounded-[1.5rem] flex items-center justify-center mb-8 shadow-xl transform rotate-3 hover:rotate-0 transition-transform">
        <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
      </div>
      <h1 class="text-4xl font-extrabold dark:text-white mb-2 tracking-tight">Kiddy Planet</h1>
      <p class="text-xs text-cyan-600 dark:text-cyan-400 uppercase tracking-[0.4em] mb-10 font-bold">Élite LMS Gateway</p>
      
      <div id="authErrorMessage" class="hidden bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-300 p-4 text-sm rounded-xl mb-6 font-bold border border-rose-200 dark:border-rose-500/30"></div>
      
      <form onsubmit="handleLogin(event)" class="space-y-6 text-left">
        <div>
          <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-2">Email Institutionnel</label>
          <div class="relative">
            <svg class="w-5 h-5 absolute left-4 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
            <input type="email" id="emailInput" required class="w-full pl-12 pr-4 py-3.5 rounded-2xl bg-white/60 dark:bg-slate-900/60 border border-slate-300 dark:border-slate-700 outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all font-medium text-slate-900 dark:text-white">
          </div>
        </div>
        <div class="relative">
          <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-2">Mot de Passe</label>
          <div class="relative">
             <svg class="w-5 h-5 absolute left-4 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
             <input type="password" id="passwordInput" required class="w-full pl-12 pr-12 py-3.5 rounded-2xl bg-white/60 dark:bg-slate-900/60 border border-slate-300 dark:border-slate-700 outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all font-medium text-slate-900 dark:text-white">
             <!-- Futuristic Eye Icon -->
             <button type="button" onclick="togglePassword()" class="absolute right-4 top-3.5 text-slate-400 hover:text-cyan-500 transition-colors">
               <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
             </button>
          </div>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-cyan-500/30 hover:shadow-cyan-500/50 hover:-translate-y-1 transition-all mt-4">S'authentifier</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appContainer" class="hidden flex-1 flex h-screen w-full relative">
    
    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-72 glass border-r dark:border-white/5 flex flex-col h-full z-40 shrink-0 absolute md:relative -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-2xl md:shadow-none">
      <div class="p-6 border-b border-slate-200 dark:border-white/5 flex items-center gap-4">
        <div class="relative group cursor-pointer" onclick="openDriveUploadModal('Photo de Profil', base64 => updateUserProfile({profile_image: base64}))">
          <img id="userAvatar" src="" class="w-14 h-14 rounded-2xl object-cover border-2 border-cyan-500 p-0.5 group-hover:opacity-50 transition-all bg-white dark:bg-slate-800">
          <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/50 rounded-2xl transition-opacity">
             <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </div>
        </div>
        <div class="overflow-hidden">
          <p id="userNameDisplay" class="text-sm font-extrabold truncate text-slate-800 dark:text-white"></p>
          <p id="userRoleBadge" class="text-[10px] uppercase tracking-widest text-cyan-600 dark:text-cyan-400 font-bold mt-1 bg-cyan-500/10 inline-block px-2 py-0.5 rounded"></p>
        </div>
      </div>

      <nav class="flex-1 overflow-y-auto p-4 space-y-4" id="navModules"></nav>
      
      <div class="p-4 border-t border-slate-200 dark:border-white/5 space-y-2">
        <button onclick="routeView('settings')" class="w-full flex items-center gap-3 px-4 py-3 text-xs font-bold tracking-widest uppercase text-slate-500 hover:text-cyan-600 dark:hover:text-cyan-400 bg-slate-100 dark:bg-slate-800 rounded-xl transition-all border border-transparent hover:border-cyan-500/30">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Paramètres
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
      <!-- TOPBAR -->
      <header class="glass h-20 px-4 md:px-8 flex items-center justify-between shrink-0 sticky top-0 z-30 border-b border-slate-200 dark:border-white/5">
        <div class="flex items-center gap-4 w-full">
          <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" class="md:hidden text-2xl text-cyan-500 hover:scale-110 transition-transform">
             <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>

      </header>
      
      <div id="viewContainer" class="p-4 md:p-8 w-full max-w-[90rem] mx-auto overflow-y-auto h-full pb-32 relative scroll-smooth"></div>
    </main>
  </div>

  <!-- GENERIC MODAL -->
  <div id="genericModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
    <div class="bg-white dark:bg-slate-900 rounded-[2rem] w-full max-w-4xl max-h-[90vh] overflow-y-auto shadow-2xl relative border border-slate-200 dark:border-slate-700 m-4">
      <button onclick="closeModal('genericModal')" class="absolute top-6 right-6 text-slate-400 hover:text-rose-500 bg-slate-100 dark:bg-slate-800 p-2 rounded-full transition-colors">

      </button>
      <div id="modalContent" class="p-8 md:p-10"></div>
    </div>
  </div>

  <!-- DRIVE UPLOAD MODAL (IMPROVED) -->
  <div id="driveUploadModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-lg">
    <div class="bg-white dark:bg-slate-900 rounded-[2rem] w-full max-w-lg p-10 shadow-2xl text-center relative border-2 border-cyan-500/50">
      <button onclick="closeModal('driveUploadModal')" class="absolute top-6 right-6 text-slate-400 hover:text-rose-500 bg-slate-100 dark:bg-slate-800 p-2 rounded-full transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>

      <p class="text-sm text-slate-500 font-medium mb-8">Stockage sécurisé sur Google Drive</p>
      
      <div id="dropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-3xl p-12 cursor-pointer hover:border-cyan-500 hover:bg-cyan-50 dark:hover:bg-cyan-900/10 transition-all flex flex-col items-center justify-center gap-4 group" onclick="document.getElementById('fileInput').click()">
        <div class="bg-cyan-100 dark:bg-cyan-900/30 p-4 rounded-full group-hover:scale-110 transition-transform">
           <svg class="w-12 h-12 text-cyan-600 dark:text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        </div>
        <p class="text-sm text-slate-600 dark:text-slate-400 font-bold">Glissez & Déposez ici</p>
        <p class="text-xs text-slate-400 font-medium uppercase tracking-widest">ou</p>
        <button type="button" class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-2.5 px-6 rounded-xl shadow-lg hover:opacity-90 transition-opacity">Parcourir les fichiers</button>

      </div>
      <p id="uploadStatus" class="mt-6 text-sm font-bold text-cyan-500 hidden flex items-center justify-center gap-2">
         <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
         Synchronisation en cours...
      </p>
    </div>
  </div>

  <div id="loader" class="hidden fixed inset-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl z-[150] flex items-center justify-center">
    <div class="text-center">
      <div class="w-20 h-20 border-4 border-cyan-500/30 border-t-cyan-500 rounded-full animate-spin mx-auto mb-6 shadow-2xl"></div>
      <p class="text-sm font-bold text-cyan-600 dark:text-cyan-400 tracking-[0.3em] uppercase">Traitement en cours</p>
    </div>
  </div>

    async function callBackend(action, payload) {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, payload }) });
      return await res.json();
    }

    async function handleLogin(e) {
      e.preventDefault();
      toggleLoader(true);
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      
      const response = await callBackend('authenticateUser', { email, password });
      if (response.success) {
        currentUser = response.user;
        localStorage.setItem('lms_session', JSON.stringify(currentUser));
        await initApp();
      } else {
        const errBox = document.getElementById('authErrorMessage');
        errBox.textContent = response.message;
        errBox.classList.remove('hidden');
        toggleLoader(false);
      }
    }

    function logout() {
      localStorage.removeItem('lms_session');
      localStorage.removeItem('last_module');
      location.reload();
    }

    async function initApp() {
      toggleLoader(true);
      await refreshData();
      
      document.getElementById('authPortal').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      
      document.getElementById('userNameDisplay').textContent = currentUser.name;
      document.getElementById('userRoleBadge').textContent = currentUser.role;
      document.getElementById('userAvatar').src = currentUser.profile_image || 'https://ui-avatars.com/api/?name='+encodeURIComponent(currentUser.name);
      
      renderSidebar();
      
      const lastModule = localStorage.getItem('last_module') || 'dashboard';
      routeView(lastModule);
      toggleLoader(false);
    }

    async function refreshData() {
      const res = await callBackend('getLMSData', {});
      if(res.success) {
         lmsData = res.data;
         // Clean undefined fields just in case
         ['classes', 'users', 'portfolio', 'announcements', 'assignments', 'submissions', 'grades'].forEach(k => {
             if(!lmsData[k]) lmsData[k] = [];
         });
      }
    }

    // Advanced Privacy Filter
    function getVisibleClasses() {
      if (currentUser.role === 'admin') return lmsData.classes;
      if (currentUser.role === 'student') return lmsData.classes.filter(c => c.id === currentUser.class_id);
      if (currentUser.role === 'parent') {
         const child = lmsData.users.find(u => u.id === currentUser.child_id);
         return lmsData.classes.filter(c => c.id === (child ? child.class_id : null));
      }
      if (currentUser.role === 'teacher') {
         const tClasses = (currentUser.classes || "").split(',').map(s=>s.trim());
         return lmsData.classes.filter(c => tClasses.includes(c.id));
      }
      return [];
    }

    function getVisibleUsers(roleFilter) {
      if(currentUser.role === 'admin') return lmsData.users.filter(u => u.role === roleFilter);
      if(currentUser.role === 'teacher' && roleFilter === 'student') {
         const myClsIds = getVisibleClasses().map(c=>c.id);
         return lmsData.users.filter(u => u.role === 'student' && myClsIds.includes(u.class_id));
      }
      return [];
    }

    function openDriveUploadModal(title, callback) {
      document.getElementById('driveModalTitle').textContent = `Import : ${title}`;
      uploadCallback = callback;
      document.getElementById('uploadStatus').classList.add('hidden');
      document.getElementById('driveUploadModal').classList.remove('hidden');
    }

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-active'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-active'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-active');
      if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
    });

    function handleFileSelect(e) { if(e.target.files.length) processFile(e.target.files[0]); }

    function processFile(file) {
      document.getElementById('uploadStatus').classList.remove('hidden');
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64 = reader.result.split(',')[1];
        const res = await callBackend('uploadToDrive', { filename: file.name, mimeType: file.type, base64: base64 });
        if(res.success) {
          document.getElementById('driveUploadModal').classList.add('hidden');
          if(uploadCallback) uploadCallback(res.url);
        } else alert('Erreur upload Drive: ' + res.error);
      };
      reader.readAsDataURL(file);
    }

    async function submitEntity(type) {
      let roleMap = { 'students': 'student', 'staff': 'teacher', 'parents': 'parent' };
      let data = {
        name: document.getElementById('entName').value, email: document.getElementById('entEmail').value, 
        password: document.getElementById('entPwd').value, role: roleMap[type],
        dob: document.getElementById('entDob')?.value || '', nationality: document.getElementById('entNat')?.value || '',
        address: document.getElementById('entAddress')?.value || ''
      };
      if(type === 'students') {
         data.class_id = document.getElementById('entClass').value;
         data.parent_id = document.getElementById('entParentId').value;
         data.program_level = document.getElementById('entLevel').value;
      }
      if(type === 'parents') {
         data.child_id = document.getElementById('entChildId').value;
         data.profession = document.getElementById('entProf').value;
         data.employer = document.getElementById('entEmp').value;
      }
      if(type === 'staff') {
         data.classes = document.getElementById('entClasses').value;
      }

      if(!data.name || !data.email) return alert("Champs obligatoires manquants");

      toggleLoader(true);
      await callBackend('postData', { sheetName: 'Users', data: data });
      await refreshData(); routeView(type); toggleLoader(false);
    }

        await refreshData();
        toggleLoader(false);
        alert(`Statut ${status} enregistré pour aujourd'hui.`);
    }

    function renderSettings(container) {
      container.innerHTML = `
        <h2 class="text-4xl font-extrabold mb-10">Paramètres du Profil</h2>
        <div class="glass p-10 rounded-[2.5rem] max-w-2xl mx-auto border border-slate-200 dark:border-slate-700 shadow-2xl relative overflow-hidden">
          <div class="absolute top-0 right-0 bg-amber-500 text-white text-[10px] uppercase tracking-widest font-extrabold px-6 py-2 rounded-bl-3xl shadow-lg">Accès Restreint</div>
          
          <div class="flex items-center gap-6 mb-10 mt-4">
             <img src="${currentUser.profile_image || 'https://ui-avatars.com/api/?name='+encodeURIComponent(currentUser.name)}" class="w-24 h-24 rounded-full border-4 border-cyan-500 shadow-xl">
             <div>
                <p class="font-extrabold text-3xl text-slate-800 dark:text-white">${currentUser.name}</p>
                <p class="text-xs font-bold text-cyan-600 dark:text-cyan-400 uppercase tracking-widest mt-2 bg-cyan-50 dark:bg-cyan-900/30 inline-block px-3 py-1 rounded-md">${currentUser.role}</p>
             </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
             <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Email</label><p class="font-bold text-lg text-slate-700 dark:text-slate-300">${currentUser.email}</p></div>
             <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">ID Unique</label><p class="font-bold text-lg text-slate-700 dark:text-slate-300">${currentUser.id}</p></div>
          </div>

          <div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 p-6 rounded-2xl mb-10 text-sm text-blue-800 dark:text-blue-300 flex items-start gap-4">
            <svg class="w-6 h-6 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p><strong>Notice Institutionnelle :</strong> Pour modifier vos informations personnelles structurelles (Nom, Email, Affectations), veuillez contacter le secrétariat administratif. Seules les préférences de sécurité et visuelles sont modifiables ici.</p>
          </div>

          <div class="space-y-6">
            <label class="block font-extrabold text-sm text-slate-700 dark:text-slate-300 uppercase tracking-widest">Mise à jour de la Sécurité</label>
            <input type="password" id="set_pwd" placeholder="Nouveau mot de passe (laissez vide pour ignorer)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl outline-none focus:border-cyan-500 font-medium">
            <button onclick="saveSettings()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold py-4 rounded-2xl mt-4 shadow-lg hover:shadow-cyan-500/30 transition-all">Enregistrer les modifications</button>
          </div>
        </div>
      `;
    }

    async function saveSettings() {
      toggleLoader(true);
      const pwd = document.getElementById('set_pwd').value;
      if (pwd) {
        await callBackend('updateProfile', { userId: currentUser.id, password: pwd });
        currentUser.password = pwd;
        localStorage.setItem('lms_session', JSON.stringify(currentUser));
        document.getElementById('set_pwd').value = '';
        alert("Mot de passe mis à jour de manière sécurisée.");
      }
      toggleLoader(false);
    }

    async function updateUserProfile(data) {
      toggleLoader(true);
      await callBackend('updateProfile', { userId: currentUser.id, ...data });
      if(data.profile_image) currentUser.profile_image = data.profile_image;
      localStorage.setItem('lms_session', JSON.stringify(currentUser));
      await initApp();
    }
  </script>
</body>
</html>
