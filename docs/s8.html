  <!-- MAIN APP -->

      <button onclick="document.getElementById('driveUploadModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-500 hover:text-rose-500">&times;</button>

      <p class="text-xs font-bold text-cyan-600 dark:text-cyan-400 tracking-[0.2em] uppercase">Synchronisation...</p>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyhjJBmH2qX2aYpeFIor5F6NgW-lwk-4sQG4tbZcOMM1tf1j17a9HC4OeUUF9p2KbkbAg/exec"; 
    
    let currentUser = null;
    let lmsData = null;
    let myChildId = null;
    let uploadCallback = null;

        title: "Général",

          { id: 'dashboard', label: 'Dashboard', icon: 'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z' },
          { id: 'portfolio', label: 'Portfolio Social', icon: 'M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z' },
          { id: 'communication', label: 'Communiqués', icon: 'M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z' }
        ]
      },
      {
        title: "Pédagogie & Évaluation",
        modules: [
          { id: 'classe', label: 'Espace Classe', icon: 'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4' },
          { id: 'courses', label: 'Cours & IB Map', icon: 'M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7' },
          { id: 'affectations', label: 'Devoirs', icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01' },
          { id: 'notes', label: 'Cahier de Notes', icon: 'M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z' },
          { id: 'bulletins', label: 'Bulletins', icon: 'M12 14l9-5-9-5-9 5 9 5z' },

          { id: 'library', label: 'Bibliothèque', icon: 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253' }

    const adminModules = {
      title: "Administration",
      modules: [

        { id: 'staff', label: 'Staff', icon: 'M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z' },
        { id: 'parents', label: 'Parents', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' },
        { id: 'attendance', label: 'Attendance', icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' }
      ]
    };

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'fr', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }

    function toggleTheme() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        document.getElementById('themeText').textContent = 'Mode Sombre';
        document.getElementById('themeIcon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>`;
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        document.getElementById('themeText').textContent = 'Mode Clair';
        document.getElementById('themeIcon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>`;
      }
    }

    function togglePassword() {
      const p = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if(p.type === 'password') {
        p.type = 'text';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>`;
      } else {
        p.type = 'password';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>`;
      }
    }

    window.onload = () => {
      if (localStorage.getItem('theme') === 'dark' || !localStorage.getItem('theme')) {
        document.documentElement.classList.add('dark');
        document.getElementById('themeText').textContent = 'Mode Clair';
        document.getElementById('themeIcon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>`;
      }
      const savedUser = localStorage.getItem('lms_session');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        initApp();
      }
    };

    function toggleLoader(show) { document.getElementById('loader').classList[show ? 'remove' : 'add']('hidden'); }

    async function callBackend(action, payload) {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, payload }) });
      return await res.json();
    }

    async function handleLogin(e) {
      e.preventDefault();
      toggleLoader(true);
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      
      const response = await callBackend('authenticateUser', { email, password });
      if (response.success) {
        currentUser = response.user;
        localStorage.setItem('lms_session', JSON.stringify(currentUser));
        await initApp();
      } else {
        const errBox = document.getElementById('authErrorMessage');
        errBox.textContent = response.message;
        errBox.classList.remove('hidden');
        toggleLoader(false);
      }
    }

    function logout() {
      localStorage.removeItem('lms_session');
      localStorage.removeItem('last_module');
      location.reload();
    }

    async function initApp() {
      toggleLoader(true);
      myChildId = currentUser.related_student_id || null;
      await refreshData();
      
      document.getElementById('authPortal').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      
      document.getElementById('userNameDisplay').textContent = currentUser.name;
      document.getElementById('userRoleBadge').textContent = currentUser.role;
      document.getElementById('userAvatar').src = currentUser.profile_image || 'https://ui-avatars.com/api/?name='+currentUser.name;
      
      renderSidebar();
      
      const lastModule = localStorage.getItem('last_module') || 'dashboard';
      routeView(lastModule);
      toggleLoader(false);
    }

    async function refreshData() {
      const res = await callBackend('getLMSData', {});
      if(res.success) lmsData = res.data;
    }

    function openDriveUploadModal(title, callback) {
      document.getElementById('driveModalTitle').textContent = `Upload : ${title}`;
      uploadCallback = callback;
      document.getElementById('uploadStatus').classList.add('hidden');
      document.getElementById('driveUploadModal').classList.remove('hidden');
    }

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-active'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-active'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-active');
      if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
    });

    function handleFileSelect(e) { if(e.target.files.length) processFile(e.target.files[0]); }

    function processFile(file) {
      document.getElementById('uploadStatus').classList.remove('hidden');
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64 = reader.result.split(',')[1];
        const res = await callBackend('uploadToDrive', { filename: file.name, mimeType: file.type, base64: base64 });
        if(res.success) {
          document.getElementById('driveUploadModal').classList.add('hidden');
          if(uploadCallback) uploadCallback(res.url);
        } else alert('Erreur upload Drive');
      };
      reader.readAsDataURL(file);
    }

      const nav = document.getElementById('navModules');
      nav.innerHTML = '';
      
      let allGroups = [...moduleGroups];
      if (currentUser.role === 'admin') {
        allGroups.push(adminModules);
      }

      allGroups.forEach(group => {
        let groupHtml = `<div class="mb-4"><h4 class="text-[10px] uppercase font-bold tracking-widest text-slate-400 mb-2 px-4">${group.title}</h4>`;

              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${m.icon}"></path></svg>

      if(!lmsData.moduleHeaders) return defaultImg;
      const h = lmsData.moduleHeaders.find(x => x.module_id === moduleId);
      return h ? h.image_url : defaultImg;
    }

    function generateRubricHeader(title, moduleId, defaultImg) {
      const img = getHeaderImg(moduleId, defaultImg);
      return `
        <div class="rubric-header" style="background-image: url('${img}');">
          <div class="rubric-title flex items-center gap-3">${title}</div>
          ${['admin', 'teacher'].includes(currentUser.role) ? 
          `<button onclick="openDriveUploadModal('Image En-tête', url => changeModuleHeader('${moduleId}', url))" class="edit-header-btn" title="Modifier l'image">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
          </button>` : ''}

    // Global Search Component embedded per view
    function getSearchBar(moduleId) {
      return `
        <div class="relative w-full max-w-md mb-6">
          <input type="text" onkeyup="performSearch('${moduleId}', this.value)" placeholder="Rechercher dans ce module..." class="w-full bg-white/50 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700 rounded-full py-2.5 pl-12 pr-4 text-sm outline-none focus:border-cyan-500 transition-all">
          <svg class="absolute left-4 top-3 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>`;
    }

    function routeView(viewId) {
      document.querySelectorAll('#navModules button').forEach(b => {
        b.classList.remove('bg-cyan-500/10', 'text-cyan-600', 'dark:text-cyan-400', 'border', 'border-cyan-500/30');
      });
      const activeBtn = document.getElementById(`btn-${viewId}`);
      if(activeBtn) activeBtn.classList.add('bg-cyan-500/10', 'text-cyan-600', 'dark:text-cyan-400', 'border', 'border-cyan-500/30');
      
      let title = 'Paramètres';
      [...moduleGroups, adminModules].forEach(g => {
        let f = g.modules.find(m => m.id === viewId);
        if(f) title = f.label;
      });
      document.getElementById('viewTitle').textContent = title;
      
      const container = document.getElementById('viewContainer');
      container.innerHTML = '';
      
      if(window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
      
      // Save state
      localStorage.setItem('last_module', viewId);

      try {
        if (viewId === 'dashboard') renderDashboard(container);
        else if (viewId === 'portfolio') renderPortfolio(container);
        else if (viewId === 'communication') renderCommunication(container);
        else if (viewId === 'affectations') renderAffectations(container);
        else if (viewId === 'notes') renderNotes(container);
        else if (viewId === 'bulletins') renderBulletins(container);
        else if (viewId === 'library') renderLibrary(container);
        else if (viewId === 'timetable') renderTimetable(container);
        else if (viewId === 'courses') renderCourses(container);
        else if (viewId === 'classe') renderClasse(container);
        else if (['students', 'staff', 'parents', 'attendance'].includes(viewId)) renderAdminEntity(container, viewId);
        else if (viewId === 'settings') renderSettings(container);
      } catch (e) {
        console.error("Render Error:", e);
      }
    }

    function performSearch(moduleId, q) {
      q = q.toLowerCase();
      const items = document.querySelectorAll(`.${moduleId}-item`);
      items.forEach(el => {
        if (el.textContent.toLowerCase().includes(q)) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });
    }

          <div class="absolute top-0 right-0 bg-amber-500 text-white text-[10px] font-bold px-4 py-1 rounded-bl-xl shadow">Accès Restreint</div>
          
          <div class="flex items-center gap-4 mb-6 mt-4">
             <img src="${currentUser.profile_image || 'https://ui-avatars.com/api/?name='+currentUser.name}" class="w-16 h-16 rounded-full border-2 border-cyan-500">
             <div>
                <p class="font-bold text-lg">${currentUser.name}</p>
                <p class="text-xs font-bold text-cyan-500 uppercase">${currentUser.role}</p>
             </div>
          </div>

          <div class="bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 p-4 rounded-xl mb-6 text-sm text-blue-800 dark:text-blue-300">
            <strong>Notice Professionnelle :</strong> Pour toute modification de vos informations personnelles (Nom, Email), veuillez contacter l'administration de l'école.
          </div>

          <div class="space-y-4">
            <label class="block font-bold text-sm text-slate-500 uppercase tracking-widest">Nouveau Mot de passe</label>
            <input type="password" id="set_pwd" placeholder="Laissez vide pour conserver l'actuel" class="w-full bg-transparent border p-3 rounded-xl outline-none focus:border-cyan-500">
            <button onclick="saveSettings()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold py-3 rounded-xl mt-6 shadow-lg hover:opacity-90">Mettre à jour la sécurité</button>
          </div>
        </div>
      `;
    }

    async function saveSettings() {
      toggleLoader(true);
      const pwd = document.getElementById('set_pwd').value;
      if (pwd) {
        await callBackend('updateProfile', { userId: currentUser.id, password: pwd });
        currentUser.password = pwd;
        localStorage.setItem('lms_session', JSON.stringify(currentUser));
        document.getElementById('set_pwd').value = '';
        alert("Mot de passe mis à jour.");
      }
      toggleLoader(false);
    }

    async function updateUserProfile(data) {
      toggleLoader(true);
      await callBackend('updateProfile', { userId: currentUser.id, ...data });
      if(data.profile_image) currentUser.profile_image = data.profile_image;
      localStorage.setItem('lms_session', JSON.stringify(currentUser));
      await initApp();
    }
  </script>
</body>
</html>
